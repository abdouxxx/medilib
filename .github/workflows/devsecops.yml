name: DevSecOps Pipeline — MediLib

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # requis pour uploader les SARIF dans l'onglet Security

jobs:

  # ────────────────────────────────
  # 1. SAST — Analyse statique du code avec Semgrep
  # ────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules.yaml
          generateSarif: "1"
        env:
          SEMGREP_RULES: .semgrep/rules.yaml

      - name: Upload résultats SARIF (Semgrep)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ────────────────────────────────
  # 2. SCA — Analyse des dépendances avec Trivy
  # ────────────────────────────────
  sca:
    name: SCA (Trivy - dépendances)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload résultats SARIF (Trivy SCA)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-sca

  # ────────────────────────────────
  # 3. BUILD — Construction de l'image Docker
  #    Ne se déclenche QUE si SAST et SCA sont passés
  # ────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t medilib-api:${{ github.sha }} .

      - name: Sauvegarde de l'image pour le job suivant
        run: docker save medilib-api:${{ github.sha }} -o medilib-image.tar

      - name: Upload de l'artifact image
        uses: actions/upload-artifact@v4
        with:
          name: medilib-image
          path: medilib-image.tar
          retention-days: 1

  # ────────────────────────────────
  # 4. SCAN IMAGE — Analyse de vulnérabilités de l'image Docker
  # ────────────────────────────────
  scan-image:
    name: Scan Image Docker (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Téléchargement de l'artifact image
        uses: actions/download-artifact@v4
        with:
          name: medilib-image

      - name: Chargement de l'image Docker
        run: docker load -i medilib-image.tar

      - name: Run Trivy (image scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'medilib-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'   # bloque le pipeline si vulnérabilités critiques trouvées

      - name: Upload résultats SARIF (Trivy Image)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ────────────────────────────────
  # 5. SUMMARY — Récapitulatif de sécurité
  # ────────────────────────────────
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sast, sca, build, scan-image]
    if: always()
    steps:
      - name: Génération du résumé
        run: |
          echo "## 🛡️ Résumé DevSecOps — MediLib" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.sast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA (Trivy - dépendances) | ${{ needs.sca.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Docker | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Image (Trivy) | ${{ needs.scan-image.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Consultez l'onglet **Security > Code scanning alerts** pour le détail des vulnérabilités." >> $GITHUB_STEP_SUMMARY